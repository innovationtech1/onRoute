# Netlify solo se usa para el servidor de pagos (Stripe Connect).
# La app sigue en GitHub Pages con su dominio propio: https://getonroute.app/
[build]
  command = ""
  publish = "netlify/public"
  functions = "netlify/functions"
  # Solo se vuelve a publicar cuando cambia el servidor de pagos (los cambios de la app van a GitHub Pages).
  # Así no se gastan publicaciones (créditos) de Netlify en cada cambio de la página.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"
  # Se copian tal cual (no se empaquetan): firebase-admin usa rutas como "firebase-admin/app".
  external_node_modules = ["firebase-admin", "stripe"]
  included_files = ["netlify/lib/**"]

# Cada hora se pagan las entregas que quedaron pendientes por falta de saldo disponible.
[functions."payDrivers"]
  schedule = "@hourly"
