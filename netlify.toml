# Netlify solo se usa para el servidor de pagos (Stripe Connect).
# La app sigue en GitHub Pages con su dominio propio: https://getonroute.app/
[build]
  command = ""
  publish = "netlify/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"
  # Se copian tal cual (no se empaquetan): firebase-admin usa rutas como "firebase-admin/app".
  external_node_modules = ["firebase-admin", "stripe"]
  included_files = ["netlify/lib/**"]
